name: Pipeline DevSecOps
on: [push, pull_request]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  dast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Levantar la app y verificar puerto
        run: |
          pip install "markupsafe<2.1.0" "itsdangerous<2.0.0" "jinja2<3.0" "werkzeug<1.0" -r requirements.txt
          nohup python app.py > app.log 2>&1 &
          sleep 5
          cat app.log
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080

      - name: Escaneo OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
